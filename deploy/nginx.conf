# Install only after the certificate has been issued. See DEPLOY.md.
server {
    listen 80;
    listen [::]:80;
    server_name anishelf.konakona.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anishelf.konakona.dev;
    ssl_certificate /etc/letsencrypt/live/anishelf.konakona.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anishelf.konakona.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/anishelf.konakona.dev/current;
    index index.html;
    error_page 404 /404.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        add_header Cache-Control "no-store" always;
    }
    location = /.well-known/deployment.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
